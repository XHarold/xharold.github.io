<svg xmlns="http://www.w3.org/2000/svg" width="3368" height="1000" viewBox="0 0 3368 1000" role="img" aria-label="线路放射图图例" fill="#213432" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif"><title>线路放射图图例</title><g transform="translate(114 0) scale(1.85)"><g data-legend-section="radial"><text x="72" y="82" font-size="54" font-weight="700" fill="#213432">线路放射图</text><text x="395" y="78" font-size="25" letter-spacing="1.3" fill="#5f7371">RADIAL NETWORK · 运营里程</text><line x1="72" x2="1625" y1="119" y2="119" stroke="#bdccc6" stroke-width="2" /><g data-legend-icon="radial-color" transform="translate(115 238) scale(1.65)"><path d="M 0 -1.8 C 27 -2.5 58 -8.5 94 -13 Q 107 -13 110 0 Q 107 13 94 13 C 58 8.5 27 2.5 0 1.8 Z" transform="rotate(-27)" fill="#E3002B" /><path d="M 0 -1.8 C 27 -2.5 58 -8.5 94 -13 Q 107 -13 110 0 Q 107 13 94 13 C 58 8.5 27 2.5 0 1.8 Z" fill="#82BF25" /><path d="M 0 -1.8 C 27 -2.5 58 -8.5 94 -13 Q 107 -13 110 0 Q 107 13 94 13 C 58 8.5 27 2.5 0 1.8 Z" transform="rotate(27)" fill="#461D84" /><circle r="4.5" fill="#213432" /></g><text x="316" y="226" font-size="30" font-weight="700">一条色带 · 一条线路</text><text x="316" y="270" font-size="24" fill="#5f7371">颜色取线路主题色</text><text x="316" y="307" font-size="22" fill="#5f7371">每条对应一条线路</text><g data-legend-icon="radial-length" transform="translate(657 205) scale(1.8)"><path d="M 0 -2 C 18 -3 40 -7 58 -10 Q 70 -10 73 0 Q 70 10 58 10 C 40 7 18 3 0 2 Z" fill="#ED6F00" /><path d="M 0 -1.8 C 27 -2.5 58 -8.5 94 -13 Q 107 -13 110 0 Q 107 13 94 13 C 58 8.5 27 2.5 0 1.8 Z" transform="translate(0 45)" fill="#0094D8" /><line x1="0" x2="0" y1="-18" y2="64" stroke="#bdccc6" stroke-width="1.5" /></g><text x="865" y="226" font-size="30" font-weight="700">由细到宽</text><text x="865" y="270" font-size="24" fill="#5f7371">长度与末端宽度</text><text x="865" y="307" font-size="22" fill="#5f7371">共同表示运营里程</text><g data-legend-icon="radial-scale" transform="translate(1168 217) scale(1.6)"><g><line x1="0" x2="0" y1="21" y2="60" stroke="#213432" stroke-width="2" /><text x="0" y="16" text-anchor="middle" font-size="13" fill="#5f7371">0</text></g><g><line x1="26.666666666666664" x2="26.666666666666664" y1="21" y2="50" stroke="#bdccc6" stroke-width="1.5" /></g><g><line x1="53.33333333333333" x2="53.33333333333333" y1="21" y2="50" stroke="#bdccc6" stroke-width="1.5" /></g><g><line x1="80" x2="80" y1="21" y2="50" stroke="#bdccc6" stroke-width="1.5" /></g><g><line x1="106.66666666666666" x2="106.66666666666666" y1="21" y2="50" stroke="#bdccc6" stroke-width="1.5" /></g><g><line x1="120" x2="120" y1="21" y2="60" stroke="#213432" stroke-width="2" /><text x="120" y="16" text-anchor="middle" font-size="13" fill="#5f7371">90</text></g><line x1="0" x2="120" y1="60" y2="60" stroke="#213432" stroke-width="2" /></g><text x="1395" y="226" font-size="30" font-weight="700">公里量尺</text><text x="1395" y="270" font-size="24" fill="#5f7371">0–90 km</text><text x="1395" y="307" font-size="22" fill="#5f7371">参考环间隔 20 km</text><line x1="72" x2="1625" y1="414" y2="414" stroke="#bdccc6" stroke-width="1.6" /><text x="72" y="463" font-size="23" fill="#5f7371">线路按等角排布，角度不代表真实地理方向。</text><text x="72" y="502" font-size="23" fill="#5f7371">色带粗细表示里程，不表示客流。</text></g></g></svg>